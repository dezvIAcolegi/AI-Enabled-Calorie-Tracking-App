[project]
name = "calorie-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-multipart",  # FastAPI needs it for UploadFile (POST /label/read)
    "httpx",
    "pyjwt[crypto]",
    "google-genai",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"  # tests/label, tests/nutrition, tests/meal may share file names
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
