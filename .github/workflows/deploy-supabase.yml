name: Deploy Supabase

# After CI passes on main: apply new migrations and deploy the Edge Functions to
# the shared project. Never runs when CI failed. Skips itself until the three
# repository secrets exist (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   shared project's database password
#   SUPABASE_PROJECT_ID    shared project ref (xbowjaompnlqjvoimxpa)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - id: secrets
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$PROJECT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets not set; skipping. See the comment at the top of this file."
          fi

      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - if: steps.secrets.outputs.present == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - if: steps.secrets.outputs.present == 'true'
        name: Apply new migrations
        run: supabase db push --remote="$PROJECT_ID" --yes

      - if: steps.secrets.outputs.present == 'true'
        name: Deploy Edge Functions
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            [ -f "$dir/index.ts" ] || continue
            supabase functions deploy "$name" --use-api --remote="$PROJECT_ID" --yes
          done
